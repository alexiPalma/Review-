name: tmp-fix-old-mode-v2
on:
  push:
    paths:
      - '.github/workflows/tmp_fix_old_mode_v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('plugin_send_text.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def old_message(c, event):')
          end = s.index('\n\ndef post_init(c):', start)
          new = '''def old_message(c, event):
    """Normalize Cardinal old-mode chat changes into the same full Message flow."""
    if not getattr(c, "old_mode_enabled", False):
        return
    chat = getattr(event, "chat", None)
    if chat is None:
        return

    def recover_and_process():
        try:
            account_id = getattr(c.account, "id", None)
            message = None

            # ChatShortcut.last_message_text is intentionally truncated.
            # Always recover the real Message from FunPay history.
            for attempt in range(5):
                messages = c.account.get_chat_history(
                    chat.id,
                    last_message_id=None,
                    interlocutor_username=getattr(chat, "name", None),
                )

                for candidate in reversed(messages or []):
                    if getattr(candidate, "chat_id", None) is not None and str(candidate.chat_id) != str(chat.id):
                        continue
                    if getattr(candidate, "by_bot", False):
                        continue
                    author_id = getattr(candidate, "author_id", None)
                    if author_id is not None and account_id is not None and str(author_id) == str(account_id):
                        continue
                    if message_text(candidate):
                        message = candidate
                        break

                if message is not None:
                    break
                time.sleep(0.2)

            if message is None:
                log.warning("Telegram Text: old mode could not recover incoming Message for chat %s", chat.id)
                return

            new_message(c, SimpleNamespace(message=message))
        except Exception:
            log.exception("Telegram Text: old mode full message recovery failed")

    threading.Thread(
        target=recover_and_process,
        name="telegram-text-old-mode",
        daemon=True,
    ).start()
'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
          compile(s, 'plugin_send_text.py', 'exec')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin_send_text.py .github/workflows/tmp_fix_old_mode_v2.yml
          git commit -m 'fix: recover full incoming messages in old mode' --allow-empty
          git rm .github/workflows/tmp_fix_old_mode_v2.yml
          git commit -m 'chore: remove temporary patch workflow'
          git push