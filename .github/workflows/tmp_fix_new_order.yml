name: tmp-fix-new-order
on:
  push:
    paths:
      - '.github/workflows/tmp_fix_new_order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('plugin_send_text.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('def resolve_lot(cardinal, event, order):')
          end = s.index('\n\ndef order_chat_id(order, event):', start)
          new_resolve = '''def resolve_lot(cardinal, event, order):
    objects = [order, getattr(event, "order", None), getattr(order, "lot", None),
               getattr(order, "offer", None), getattr(order, "shortcut", None),
               getattr(order, "order_shortcut", None)]

    for obj in objects:
        value = lot_id_from_object(obj)
        if value is not None:
            return value

    # Некоторые версии FunPayAPI не expose lot_id on OrderShortcut/Order.
    # Recover it from known URL fields before falling back to ID: markers.
    url_re = re.compile(r"(?:/lots/|[?&]id=)(\\d+)")
    for obj in objects:
        for attr in ("looking_link", "link", "url"):
            value = clean(getattr(obj, attr, None))
            if value:
                match = url_re.search(value)
                if match:
                    return match.group(1)
        html_value = clean(getattr(obj, "html", None))
        if html_value:
            match = url_re.search(html_value)
            if match:
                return match.group(1)

    for obj in objects:
        for attr in ("full_description", "description", "short_description"):
            value = clean(getattr(obj, attr, None))
            match = ID_RE.search(value)
            if match:
                return match.group(1)
    return None
'''
          s = s[:start] + new_resolve + s[end:]

          start = s.index('def new_order(c, event):')
          end = s.index('\n\ndef new_message(c, event):', start)
          new_order = '''def new_order(c, event):
    try:
        order = get_full_order(c, event)
        oid = order_id_from_event(event)
        if not oid:
            log.warning("Telegram Text: new order without id")
            return
        with _lock:
            if oid in _orders:
                return

        # Same detection model as the working Telegram Gifts plugin:
        # use the real order and its displayed lot title, not an assumed lot_id field.
        lot_title = (
            getattr(order, "title", None)
            or getattr(order, "short_description", None)
            or getattr(order, "description", None)
            or getattr(getattr(event, "order", None), "description", None)
            or ""
        )
        lot_title = str(lot_title).strip()

        lot = resolve_lot(c, event, order)
        binding = None
        bound_lot = None
        with _lock:
            if lot is not None:
                candidate = _lots.get(str(lot))
                if isinstance(candidate, dict) and candidate.get("enabled", True):
                    binding = candidate
                    bound_lot = str(lot)

            if binding is None and lot_title:
                normalized_title = clean(lot_title).casefold()
                for saved_lot, candidate in _lots.items():
                    if not isinstance(candidate, dict) or not candidate.get("enabled", True):
                        continue
                    saved_title = clean(candidate.get("title", "")).casefold()
                    if saved_title and saved_title == normalized_title:
                        binding = candidate
                        bound_lot = str(saved_lot)
                        break

        # If the binding was created without a title and FunPay did not expose lot_id,
        # resolve the title from the saved lot id once and compare it with the order.
        if binding is None and lot_title:
            with _lock:
                saved_lots = list(_lots.items())
            for saved_lot, candidate in saved_lots:
                if not isinstance(candidate, dict) or not candidate.get("enabled", True):
                    continue
                if clean(candidate.get("title", "")):
                    continue
                try:
                    fields = c.account.get_lot_fields(str(saved_lot))
                    fetched_title = clean(
                        getattr(fields, "title_ru", None)
                        or getattr(fields, "title_en", None)
                        or getattr(fields, "title", None)
                    )
                    if fetched_title:
                        with _lock:
                            current = _lots.get(str(saved_lot))
                            if isinstance(current, dict):
                                current["title"] = fetched_title
                                persist()
                        if fetched_title.casefold() == clean(lot_title).casefold():
                            binding = candidate
                            bound_lot = str(saved_lot)
                            break
                except Exception:
                    log.debug("Telegram Text: get_lot_fields failed for bound lot %s", saved_lot, exc_info=True)

        if binding is None:
            log.info(
                "Telegram Text: order %s skipped: no enabled Telegram Text lot binding (title=%r lot_id=%r)",
                oid,
                lot_title,
                lot,
            )
            return

        chat_id = order_chat_id(order, event)
        buyer = order_buyer(order, event)
        buyer_id = order_buyer_id(order, event)
        if chat_id is None and buyer:
            try:
                chat = c.account.get_chat_by_name(buyer)
                chat_id = getattr(chat, "id", None) if chat else None
            except Exception:
                log.debug("Telegram Text: get_chat_by_name failed", exc_info=True)
        if chat_id is None:
            log.error("Telegram Text: order %s has no FunPay chat id", oid)
            return

        record = {
            "order_id": oid,
            "lot_id": bound_lot,
            "lot_title": lot_title,
            "chat_id": chat_id,
            "buyer": buyer,
            "buyer_id": buyer_id,
            "username": None,
            "text": None,
            "status": S_USERNAME,
            "created_at": time.time(),
            "error": None,
        }
        with _lock:
            _orders[oid] = record
            persist()

        send_funpay(
            chat_id,
            "👋 Спасибо за покупку!\\n\\n"
            "Отправьте Telegram username, куда нужно отправить текст.\\n\\n"
            "Пример: @username\\n\\n"
            "❗ Для отмены заказа отправьте: !возврат"
        )
        log.info("Telegram Text: created order=%s lot=%s title=%r chat=%s buyer=%r", oid, bound_lot, lot_title, chat_id, buyer)
    except Exception:
        log.exception("Telegram Text: new order handler failed")
'''
          s = s[:start] + new_order + s[end:]
          compile(s, 'plugin_send_text.py', 'exec')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin_send_text.py .github/workflows/tmp_fix_new_order.yml
          git commit -m 'fix: match text orders using FunPay order title'
          git rm .github/workflows/tmp_fix_new_order.yml
          git commit -m 'chore: remove temporary new order workflow'
          git push